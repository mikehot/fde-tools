[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-tools"
version = "1.0.0"
description = "Field Deployed Engineer & Applied AI Industrial Automation CLI Toolkit"
readme = "README.md"
authors = [
  { name = "Jacky Chou (周亚杰)", email = "mikehot668@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7.0.0"
]
full = [
  "pillow>=10.0.0",
  "mcp>=1.0.0",
  "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/mikehot/fde-tools"
Repository = "https://github.com/mikehot/fde-tools.git"
Issues = "https://github.com/mikehot/fde-tools/issues"

[project.scripts]
fde = "fde_tools.cli:main"
fde-tools = "fde_tools.cli:main"
